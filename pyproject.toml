[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-click-capture"
version = "0.1.0"
description = "Captura a tela a cada clique do mouse — salva PNGs sequenciais (01.png, 02.png, ...)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Felipe Moreira" }]
dependencies = [
    "pynput>=1.7.6",
    "mss>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
scc = "screen_click_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
